name: Validate pipeline and notebook

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lightweight-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install media tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Install lightweight test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check generated notebook and Python syntax
        run: |
          python scripts/build_notebook.py --check
          python -m compileall -q proxmax scripts
      - name: Run tests (no model downloads)
        run: python -m pytest -q
